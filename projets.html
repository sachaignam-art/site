        nav { display: flex; align-items: center; gap: 25px; }
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: block;
            opacity: 0;
            pointer-events: none;
            position: absolute;
            background-color: #333;
            min-width: 160px; /* J'ai légèrement augmenté pour que le texte respire */
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
            z-index: 1001;
            border-radius: 0 0 14px 14px;
            overflow: hidden;
            top: 100%;
            
            /* --- MODIFICATION 1 : CENTRAGE HORIZONTAL --- */
            left: 50%; 
            
            border: 2px solid #444;
            border-top: none;
            
            /* --- MODIFICATION 2 : MISE A JOUR DE L'ANIMATION --- */
            /* On ajoute translate(-50%) pour compenser le centrage */
            transform: translate(-50%, 10px) scaleY(0.98);
            transition: opacity 0.25s cubic-bezier(.68,-0.55,.27,1.55), transform 0.25s cubic-bezier(.68,-0.55,.27,1.55);
            
            /* Centrer le texte à l'intérieur du menu si tu préfères */
            text-align: center; 
        }

        .dropdown:hover .dropdown-content,
        .dropdown:focus-within .dropdown-content {
            opacity: 1;
            pointer-events: auto;
            
            /* --- MODIFICATION 3 : ETAT FINAL DE L'ANIMATION --- */
            /* On garde le translate(-50%) ici aussi pour qu'il reste centré */
            transform: translate(-50%, 0) scaleY(1);
        }
        .dropdown-content:before {
            content: '';
            display: block;
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 14px;
            background: transparent;
        }
        .dropdown-content a {
            color: #a259ff;
            padding: 9px 12px;
            text-decoration: none;
            display: block;
            background: none;
            font-size: 15px;
            transition: background 0.18s, color 0.18s;
            outline: none;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .dropdown-content a::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 6px;
            height: 2px;
            background: linear-gradient(90deg, #7d7aff, #a259ff 50%, #7d7aff);
            transform: scaleX(0);
            transition: transform 0.3s cubic-bezier(.68,-0.55,.27,1.55);
            transform-origin: left;
        }
        .dropdown-content a:hover::after, .dropdown-content a:focus::after {
            transform: scaleX(1);
        }
        .dropdown-content a:hover,
        .dropdown-content a:focus {
            background: #444;
            color: #fff;
        }

  .gallery-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); 
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
}

/* TABLETTE */
@media (max-width: 1024px) {
    .gallery-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

/* TELEPHONE */
@media (max-width: 768px) {
    .gallery-container {
        grid-template-columns: 1fr; /* 1 colonne */
        padding: 0 20px;
    }
}
.gallery-item a.project-link {
    display: block;
    width: 100%;
    height: 100%;
    text-decoration: none; /* Enlever le soulignement du titre */
    position: relative;
    z-index: 10; /* Assure que le lien est au-dessus des overlays */
}
.gallery-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.1;
    overflow: hidden;
    border-radius: 16px;
    background: #050505; /* Fond plus profond */
    cursor: pointer;
    transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
    border: 1px solid rgba(255, 255, 255, 0.03);
}

/* Image avec zoom et effet de focus */
.gallery-item img {
    border-radius: 0; /* On utilise le border-radius du parent .gallery-item */
    box-shadow: none; /* On utilise l'ombre du parent .gallery-item */
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(60%) brightness(0.7) blur(0px);
    transition: transform 1.2s cubic-bezier(0.2, 1, 0.3, 1), filter 0.8s ease;
}

/* Overlay en dégradé plus riche */
.gallery-item::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top, 
        rgba(10, 10, 10, 0.95) 0%, 
        rgba(10, 10, 10, 0.2) 50%, 
        transparent 100%
    );
    opacity: 0.8;
    transition: opacity 0.6s ease;
    z-index: 2;
}

/* --- AJOUT : Effet de reflet brillant au survol --- */
.gallery-item::before {
    content: "";
    position: absolute;
    top: 0;
    left: -150%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
    );
    transition: left 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 4;
    transform: skewX(-25deg);
}

/* Conteneur du titre avec typo plus aérée */
.gallery-item h3 {
    position: absolute;
    bottom: 30px;
    left: 30px;
    right: 30px;
    margin: 0;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 3px; /* Espacement augmenté */
    z-index: 5;
    transform: translateY(15px);
    opacity: 0.8;
    transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

/* Trait violet avec éclat (glow) */
.gallery-item h3::after {
    content: "";
    display: block;
    width: 20px;
    height: 2px;
    background: #7d7aff;
    margin-top: 12px;
    box-shadow: 0 0 8px rgba(125, 122, 255, 0);
    transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
}

/* --- EFFETS AU SURVOL (HOVER) --- */

.gallery-item:hover {
    transform: translateY(-12px) scale(1.02);
    border-color: rgba(125, 122, 255, 0.5);
    /* Ombre multicouche pour plus de réalisme */
    box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(125, 122, 255, 0.15);
}

.gallery-item:hover img {
    transform: scale(1.15);
    filter: grayscale(0%) brightness(1) blur(0px);
}

.gallery-item:hover::before {
    left: 150%; /* Passage du reflet */
}

.gallery-item:hover::after {
    opacity: 0.5; /* On éclaircit l'image pour mieux voir le projet */
}

.gallery-item:hover h3 {
    transform: translateY(0);
    opacity: 1;
}

.gallery-item:hover h3::after {
    width: 60px; /* Extension élégante, pas besoin de 100% */
    background: #a259ff;
    box-shadow: 0 0 12px rgba(162, 89, 255, 0.6);
}

            <a href="index.html">Accueil</a>
            <div class="dropdown">
                <a href="formation.html" class="dropbtn" style="position:relative;z-index:2;" tabindex="0" aria-haspopup="true" aria-expanded="false">Formation</a>
            </div>
            <div class="dropdown">
                <a href="projets.html" class="dropbtn active" style="position:relative;z-index:2;" tabindex="0" aria-haspopup="true" aria-expanded="false">Projets</a>
            </div>
             <div class="dropdown">
                <a href="apropos.html" class="dropbtn" style="position:relative;z-index:2;" tabindex="0" aria-haspopup="true" aria-expanded="false">À propos</a>
            </div>
                <script>
                    // Accessibilité clavier pour le menu déroulant
                    document.addEventListener('DOMContentLoaded', function() {
                        document.querySelectorAll('.dropdown .dropbtn').forEach(function(btn) {
                            btn.addEventListener('keydown', function(e) {
                                if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
                                    e.preventDefault();
                                    var menu = btn.nextElementSibling;
                                    if (menu) {
                                        menu.querySelector('a').focus();
                                    }
                                }
                            });
                        });
                        document.querySelectorAll('.dropdown-content a').forEach(function(link, idx, arr) {
                            link.addEventListener('keydown', function(e) {
                                if (e.key === 'ArrowDown') {
                                    e.preventDefault();
                                    if (arr[idx+1]) arr[idx+1].focus();
                                    else arr[0].focus();
                                } else if (e.key === 'ArrowUp') {
                                    e.preventDefault();
                                    if (arr[idx-1]) arr[idx-1].focus();
                                    else arr[arr.length-1].focus();
                                } else if (e.key === 'Escape') {
                                    e.preventDefault();
                                    link.closest('.dropdown').querySelector('.dropbtn').focus();
                                }
                            });
                        });
                    });

         // FORCER LE RETOUR EN HAUT AU RAFRAÎCHISSEMENT
        // On utilise 'beforeunload' pour s'assurer que le navigateur ne garde pas la position
        window.onbeforeunload = function () {
            window.scrollTo(0, 0);
        };

        // Alternative plus robuste si la première ne suffit pas selon le navigateur
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }
        function openModal(element) {
            document.getElementById("imageModal").style.display = "flex";
            document.getElementById("modalImg").src = element.src;
        }
        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

    const burgerBtn = document.getElementById('burgerBtn');
const navMenu = document.querySelector('nav');

burgerBtn.addEventListener('click', () => {
    navMenu.classList.toggle('active');
    
    // Optionnel : anime les barres du burger
    const spans = burgerBtn.querySelectorAll('span');
    burgerBtn.classList.toggle('open');
    if(burgerBtn.classList.contains('open')) {
        spans[0].style.transform = "translateY(8px) rotate(45deg)";
        spans[1].style.opacity = "0";
        spans[2].style.transform = "translateY(-8px) rotate(-45deg)";
    } else {
        spans[0].style.transform = "none";
        spans[1].style.opacity = "1";
        spans[2].style.transform = "none";
    }
});

// Ajoute ceci à la fin de ton script actuel
document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
        navMenu.classList.remove('active');
        burgerBtn.classList.remove('open');
        // Réinitialise l'apparence des barres
        const spans = burgerBtn.querySelectorAll('span');
        spans[0].style.transform = "none";
        spans[1].style.opacity = "1";
        spans[2].style.transform = "none";
    });
});

const buttons = document.querySelectorAll(".filter-btn");
const projects = document.querySelectorAll(".gallery-item");

buttons.forEach(btn => {
    btn.addEventListener("click", () => {

        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const filter = btn.getAttribute("data-filter");

        projects.forEach(project => {
            if(filter === "all" || project.dataset.category === filter){
                project.style.display = "block";
            } else {
                project.style.display = "none";
            }
        });
    });
});
function scrollToGallery() {
    const section = document.getElementById("about-section");
    const offset = 80; // hauteur du header
    const position = section.offsetTop - offset;

    window.scrollTo({
        top: position,
        behavior: "smooth"
    });
}
    </script>
